name: Bug report
description: Something in domeneshop-mcp isn't working as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search [existing issues](../../issues) first to avoid duplicates.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug. Include the exact error message if there was one.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: How can we reproduce this? Include the MCP tool called and its arguments if relevant.
      placeholder: |
        1. Configure the server with ...
        2. Call tool `dns_add_record` with ...
        3. See error
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: domeneshop-mcp version
      description: Output of `npx domeneshop-mcp --version` or the version pinned in your MCP client config.
      placeholder: "1.0.0"
    validations:
      required: true

  - type: dropdown
    id: client
    attributes:
      label: MCP client
      options:
        - Claude Code
        - Claude Desktop
        - Other (specify below)
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v20.x"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Server logs, stack traces, or MCP client output. This is automatically formatted as code — no need for backticks.
      render: shell

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else that might be relevant (network setup, Domeneshop account type, etc.).
