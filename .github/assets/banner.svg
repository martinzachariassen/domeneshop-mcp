<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="banner-title">
  <title id="banner-title">domeneshop-mcp — MCP server for Domeneshop domains, DNS, HTTP forwards, dynamic DNS and invoices</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#0d1b36"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#2f6bff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2f6bff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.08" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#14b8a6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#ffffff" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#b9cdfa"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141f38"/>
      <stop offset="1" stop-color="#0f182d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>
    <style>
      .sans { font-family: Inter, "SF Pro Display", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#dots)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <rect width="1280" height="640" fill="url(#glow2)"/>

  <!-- Network motif: nodes linked like a DNS tree -->
  <g stroke="#4c7dff" stroke-opacity="0.18" stroke-width="1.5" fill="none">
    <path d="M1180 70 L1240 150 M1180 70 L1100 40 M1240 150 L1210 250"/>
    <path d="M60 520 L140 590 M140 590 L250 600"/>
  </g>
  <g fill="#6f97ff" fill-opacity="0.35">
    <circle cx="1180" cy="70" r="4"/><circle cx="1240" cy="150" r="3"/>
    <circle cx="1100" cy="40" r="3"/><circle cx="1210" cy="250" r="3"/>
    <circle cx="60" cy="520" r="3"/><circle cx="140" cy="590" r="4"/><circle cx="250" cy="600" r="3"/>
  </g>

  <!-- Left: title block -->
  <g class="sans">
    <!-- Globe mark -->
    <g transform="translate(80 118)">
      <rect width="64" height="64" rx="16" fill="#2f6bff"/>
      <g fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round">
        <circle cx="32" cy="32" r="17"/>
        <ellipse cx="32" cy="32" rx="7.5" ry="17"/>
        <path d="M15 32 H49 M18 23 H46 M18 41 H46"/>
      </g>
    </g>
    <g transform="translate(164 132)">
      <rect width="160" height="36" rx="18" fill="#2f6bff" fill-opacity="0.14" stroke="#4c7dff" stroke-opacity="0.5"/>
      <circle cx="20" cy="18" r="4.5" fill="#34d399"/>
      <text x="34" y="24" font-size="15" font-weight="600" fill="#bcd0ff" letter-spacing="1.6">MCP SERVER</text>
    </g>

    <text x="78" y="282" font-size="76" font-weight="800" fill="url(#title)" letter-spacing="-2.5">domeneshop</text>
    <text x="72" y="352" font-size="58" font-weight="700" fill="#4c7dff" letter-spacing="-1.5" class="mono">-mcp</text>

    <text x="80" y="418" font-size="23" fill="#a9b6d3">
      <tspan x="80">Domains, DNS, HTTP forwards, dynamic DNS</tspan>
      <tspan x="80" dy="34">and invoices — from any AI assistant.</tspan>
    </text>

    <!-- Chips -->
    <g font-size="16" font-weight="600" fill="#dbe5ff">
      <g transform="translate(80 504)">
        <rect width="104" height="38" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="52" y="25" text-anchor="middle">17 tools</text>
      </g>
      <g transform="translate(196 504)">
        <rect width="88" height="38" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="44" y="25" text-anchor="middle">stdio</text>
      </g>
      <g transform="translate(296 504)">
        <rect width="150" height="38" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="75" y="25" text-anchor="middle">read-only mode</text>
      </g>
      <g transform="translate(458 504)">
        <rect width="124" height="38" rx="10" fill="#ffffff" fill-opacity="0.06" stroke="#ffffff" stroke-opacity="0.12"/>
        <text x="62" y="25" text-anchor="middle">npx · brew</text>
      </g>
    </g>
  </g>

  <!-- Right: assistant session card -->
  <g transform="translate(676 112)" filter="url(#shadow)">
    <rect width="524" height="420" rx="18" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.1"/>
    <path d="M0 18 a18 18 0 0 1 18 -18 h488 a18 18 0 0 1 18 18 v28 h-524 z" fill="#ffffff" fill-opacity="0.035"/>
    <line x1="0" y1="46" x2="524" y2="46" stroke="#ffffff" stroke-opacity="0.08"/>
    <circle cx="24" cy="23" r="6" fill="#ff5f57"/>
    <circle cx="44" cy="23" r="6" fill="#febc2e"/>
    <circle cx="64" cy="23" r="6" fill="#28c840"/>
    <text x="262" y="28" text-anchor="middle" class="mono" font-size="13" fill="#7f8db0">assistant · domeneshop</text>

    <g class="mono" font-size="15">
      <!-- User prompt -->
      <text x="26" y="90" fill="#7f8db0">&gt;</text>
      <text x="46" y="90" fill="#e8eeff">Point www.example.no at my new server</text>

      <!-- Tool call 1 -->
      <circle cx="31" cy="133" r="5" fill="#34d399"/>
      <text x="46" y="138"><tspan fill="#8fb0ff" font-weight="700">list_dns_records</tspan><tspan fill="#7f8db0">(domain_id: 1337)</tspan></text>
      <text x="46" y="164" fill="#6b7896">└ 6 records · www A 198.51.100.4</text>

      <!-- Tool call 2 -->
      <circle cx="31" cy="207" r="5" fill="#34d399"/>
      <text x="46" y="212" fill="#8fb0ff" font-weight="700">upsert_dns_record</text>
      <g fill="#7f8db0">
        <text x="66" y="240"><tspan fill="#c3a6ff">host</tspan>  "www"</text>
        <text x="66" y="264"><tspan fill="#c3a6ff">type</tspan>  "A"</text>
        <text x="66" y="288"><tspan fill="#c3a6ff">data</tspan>  <tspan fill="#fbbf77">"203.0.113.10"</tspan></text>
        <text x="66" y="312"><tspan fill="#c3a6ff">ttl </tspan>  <tspan fill="#fbbf77">3600</tspan></text>
      </g>
      <line x1="31" y1="222" x2="31" y2="314" stroke="#ffffff" stroke-opacity="0.1" stroke-width="2"/>

      <!-- Result -->
      <rect x="26" y="340" width="472" height="52" rx="10" fill="#34d399" fill-opacity="0.1" stroke="#34d399" stroke-opacity="0.35"/>
      <text x="46" y="372" fill="#6ee7b7">✓ www.example.no → 203.0.113.10</text>
    </g>
  </g>
</svg>
