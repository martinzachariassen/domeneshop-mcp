<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="banner-title">
  <title id="banner-title">domeneshop-mcp — MCP server for Domeneshop domains, DNS, HTTP forwards, dynamic DNS and invoices</title>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#2e3034" stroke-width="1" stroke-opacity="0.45"/>
    </pattern>
    <pattern id="grid-major" width="160" height="160" patternUnits="userSpaceOnUse">
      <path d="M160 0 H0 V160" fill="none" stroke="#2e3034" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a29aff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a29aff" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; }
      .display { font-family: Newsreader, Georgia, "Times New Roman", serif; font-style: italic; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
      .live { animation: pulse 2s ease-in-out infinite; }
      @keyframes typing {
        0%, 3% { clip-path: inset(0 100% 0 0); opacity: 1; }
        13%, 93% { clip-path: inset(0 0 0 0); opacity: 1; }
        97%, 100% { clip-path: inset(0 100% 0 0); opacity: 1; }
      }
      .typing { animation: typing 14s steps(27, end) infinite; }
      @keyframes prompt {
        0%, 3% { opacity: 0; transform: translateY(5px); }
        5%, 93% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; transform: translateY(0); }
      }
      .prompt { animation: prompt 14s ease-out infinite; }
      @keyframes list {
        0%, 19% { opacity: 0; transform: translateY(5px); }
        21%, 93% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; transform: translateY(0); }
      }
      .list { animation: list 14s ease-out infinite; }
      @keyframes listResult {
        0%, 23% { opacity: 0; transform: translateY(5px); }
        25%, 93% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; transform: translateY(0); }
      }
      .listResult { animation: listResult 14s ease-out infinite; }
      @keyframes mx {
        0%, 32% { opacity: 0; transform: translateY(5px); }
        34%, 93% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; transform: translateY(0); }
      }
      .mx { animation: mx 14s ease-out infinite; }
      @keyframes mxArgs {
        0%, 35% { opacity: 0; transform: translateY(5px); }
        37%, 93% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; transform: translateY(0); }
      }
      .mxArgs { animation: mxArgs 14s ease-out infinite; }
      @keyframes spf {
        0%, 45% { opacity: 0; transform: translateY(5px); }
        47%, 93% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; transform: translateY(0); }
      }
      .spf { animation: spf 14s ease-out infinite; }
      @keyframes spfArgs {
        0%, 48% { opacity: 0; transform: translateY(5px); }
        50%, 93% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; transform: translateY(0); }
      }
      .spfArgs { animation: spfArgs 14s ease-out infinite; }
      @keyframes done {
        0%, 58% { opacity: 0; transform: translateY(5px); }
        60%, 93% { opacity: 1; transform: translateY(0); }
        97%, 100% { opacity: 0; transform: translateY(0); }
      }
      .done { animation: done 14s ease-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .typing, .live, .prompt, .list, .listResult, .mx, .mxArgs, .spf, .spfArgs, .done { animation: none; opacity: 1; clip-path: none; transform: none; }
      }
    </style>
  </defs>

  <rect width="1280" height="640" fill="#151619"/>
  <rect width="1280" height="640" fill="url(#grid)"/>
  <rect width="1280" height="640" fill="url(#grid-major)"/>
  <ellipse cx="978" cy="332" rx="420" ry="300" fill="url(#glow)"/>

  <g fill="none" stroke="#968dfd" stroke-width="2">
    <path d="M24 48 V24 H48"/><path d="M1232 24 H1256 V48"/>
    <path d="M24 592 V616 H48"/><path d="M1232 616 H1256 V592"/>
  </g>

  <g transform="translate(72 56)">
    <g transform="scale(1.375)">
      <rect x="1" y="1" width="30" height="30" rx="6" fill="#e9ebef"/>
      <polygon points="7,25 7,7 11.5,7 16,18.5 20.5,7 25,7 25,25" fill="#151619"/>
    </g>
    <text x="60" y="31" class="mono" font-size="28" font-weight="700" letter-spacing="-0.8" fill="#e9ebef">mlz<tspan fill="#a29aff">.</tspan></text>
  </g>
  <g transform="translate(1004 62)">
    <rect width="204" height="32" rx="4" fill="#151619" stroke="#2e3034" stroke-width="1.5"/>
    <text x="103" y="21" text-anchor="middle" class="mono" font-size="12" letter-spacing="2.6" fill="#cfd1d5">OPEN SOURCE · MIT</text>
  </g>

  <text x="72" y="196" class="mono" font-size="14" letter-spacing="4.5" fill="#cfd1d5">MCP SERVER<tspan fill="#a29aff" dx="10">/</tspan><tspan dx="10">DOMENESHOP API</tspan></text>
  <text x="66" y="306" class="display" font-size="106" font-weight="500" letter-spacing="-1.5" fill="#e9ebef">Domeneshop</text>
  <text x="66" y="406" class="display" font-size="106" font-weight="500" letter-spacing="-1.5" fill="#e9ebef">MCP</text>
  <text class="mono" font-size="17" fill="#cfd1d5">
    <tspan x="72" y="468">Domains, DNS, HTTP forwards, dynamic DNS</tspan>
    <tspan x="72" dy="28">and invoices — from any AI assistant.</tspan>
  </text>

  <g transform="translate(748 150)" class="mono">
    <rect width="460" height="364" rx="4" fill="#1b1c20" stroke="#e9ebef" stroke-width="1.5"/>
    <text x="22" y="30" font-size="11" letter-spacing="2.4" fill="#9b9ea5">ASSISTANT SESSION</text>
    <text x="438" y="30" text-anchor="end" font-size="11" letter-spacing="2.4" fill="#a29aff"><tspan class="live">●</tspan> CONNECTED</text>
    <line x1="0" y1="46" x2="460" y2="46" stroke="#e9ebef" stroke-width="1.5"/>

    <g font-size="14">
      <text x="22" y="84" fill="#9b9ea5">&gt;</text>
      <text x="42" y="84" fill="#e9ebef" class="typing">Set up email for example.no</text>

      <g class="list">
        <rect x="22" y="115" width="8" height="8" fill="#a29aff"/>
        <text x="42" y="124"><tspan fill="#a29aff" font-weight="700">list_dns_records</tspan><tspan fill="#9b9ea5"> domain_id=1337</tspan></text>
      </g>
      <text x="42" y="148" fill="#9b9ea5" class="listResult">└ 6 records · no MX, no SPF</text>

      <g class="mx">
        <rect x="22" y="179" width="8" height="8" fill="#a29aff"/>
        <text x="42" y="188" fill="#a29aff" font-weight="700">upsert_dns_record</text>
      </g>
      <text x="42" y="212" class="mxArgs" xml:space="preserve"><tspan fill="#9b9ea5">MX  </tspan><tspan fill="#ec6d3d">@ → mail.example.no</tspan><tspan fill="#9b9ea5"> prio </tspan><tspan fill="#ec6d3d">10</tspan></text>

      <g class="spf">
        <rect x="22" y="243" width="8" height="8" fill="#a29aff"/>
        <text x="42" y="252" fill="#a29aff" font-weight="700">upsert_dns_record</text>
      </g>
      <text x="42" y="276" class="spfArgs" xml:space="preserve"><tspan fill="#9b9ea5">TXT </tspan><tspan fill="#ec6d3d">@ "v=spf1 mx ~all"</tspan></text>

      <g class="done">
        <rect x="22" y="310" width="416" height="34" rx="4" fill="none" stroke="#a29aff" stroke-width="1.5"/>
        <text x="36" y="332" fill="#a29aff">✓ example.no can receive mail · 2 records</text>
      </g>
    </g>
  </g>

  <line x1="72" y1="556" x2="1208" y2="556" stroke="#2e3034" stroke-width="1.5"/>
  <text x="72" y="592" class="mono" font-size="14" letter-spacing="3" fill="#e9ebef">NPX DOMENESHOP-MCP</text>
  <rect x="842" y="583" width="9" height="9" fill="#a29aff"/>
  <text x="1208" y="592" text-anchor="end" class="mono" font-size="13" letter-spacing="2.6" fill="#cfd1d5">17 TOOLS · STDIO · READ-ONLY MODE</text>
</svg>
