name: release-pr

# Drives the whole release from main, so merging the release PR is the only
# manual step:
#
# - While changesets are pending, keeps a "chore: release" PR open. Merging it
#   bumps package.json, server.json and mcpb/manifest.json and writes
#   CHANGELOG.md.
# - Once nothing is pending and package.json's version has no tag yet (i.e. the
#   release PR was just merged), tags the merge commit vX.Y.Z. That triggers
#   release.yml: npm, MCP Registry, GitHub Release and the Homebrew tap.
#
# Writes use a GitHub App token rather than GITHUB_TOKEN: the App's commits are
# signed (required on main), and its PRs and tags trigger other workflows (CI on
# the release PR, release.yml on the tag), which GITHUB_TOKEN's do not.
on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Get a release token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        id: changesets
        # v2 commits through the GitHub API by default, so the release commit
        # is signed and passes the "required signatures" rule on main.
        with:
          version-script: npm run version
          pr-title: "chore: release"
          commit-message: "chore: release"
          github-token: ${{ steps.app-token.outputs.token }}

      # Idempotent: ordinary merges without a version bump find the tag
      # already there and do nothing.
      - name: Tag the release
        if: steps.changesets.outputs.has-changesets == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
            echo "${tag} already exists, nothing to release."
            exit 0
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/tags/${tag}" -f sha="${GITHUB_SHA}" >/dev/null
          echo "Tagged ${GITHUB_SHA} as ${tag}; release.yml takes it from here."
