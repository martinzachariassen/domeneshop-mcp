name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run format:check

      - run: npm run test:coverage

      - run: npm run build

      - if: matrix.node-version == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 14

  package:
    # Installs the packed tarball the way users get it from npm, so a broken
    # `files` list, bin entry or missing runtime dependency fails here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      # Unpacks the tarball and installs only its runtime dependencies from the
      # lockfile, so a file missing from `files`, a broken bin entry or a
      # runtime dependency listed under devDependencies all fail here.
      - name: Pack and install the tarball
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/pkg"
          tar -xzf "$RUNNER_TEMP"/domeneshop-mcp-*.tgz -C "$RUNNER_TEMP/pkg" --strip-components=1
          cp package-lock.json "$RUNNER_TEMP/pkg/"
          cd "$RUNNER_TEMP/pkg"
          npm ci --omit=dev --ignore-scripts
          node "$(node -p "require('./package.json').bin['domeneshop-mcp']")" --version

      - name: Validate the Claude Desktop bundle
        run: npm run mcpb:build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm audit --audit-level=high
