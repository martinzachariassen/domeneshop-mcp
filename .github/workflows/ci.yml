name: ci

# Build, vet and test on every push and pull request, so a broken commit is
# caught here rather than when a version tag triggers the release workflow.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'ed:"; echo "$unformatted"; exit 1
          fi

      - run: go build ./...

      - run: go vet ./...

      - run: go test -race ./...
