name: release

# Runs once you push a version tag (e.g. `git tag v0.1.0 && git push --tags`).
# Builds the darwin/linux binaries in a public CI run tied to this exact
# commit, keyless-signs the checksums file via cosign (Sigstore), publishes a
# signed build-provenance attestation, and creates the GitHub Release.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # goreleaser: create the GitHub Release and upload assets
  id-token: write # cosign + attestation: mint a short-lived OIDC identity, no stored secrets
  attestations: write # publish the build provenance attestation

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history/tags for the changelog

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@v3

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> 2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*.tar.gz
