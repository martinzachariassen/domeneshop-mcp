name: release

# Runs on a vX.Y.Z tag, which release-pr.yml creates when the release PR is
# merged (pushing a tag by hand works too).
# Publishes to npm using trusted publishing (OIDC, no stored token) with
# provenance attached, publishes server.json to the MCP Registry (GitHub OIDC),
# then creates the matching GitHub Release with the npm tarball and the Claude
# Desktop bundle and opens a PR bumping the Homebrew formula in
# martinzachariassen/homebrew-tap. A second job attaches SLSA build provenance
# (multiple.intoto.jsonl) for both release files.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  MCP_PUBLISHER_VERSION: v1.8.1

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
      id-token: write # npm trusted publishing and MCP Registry login
    outputs:
      hashes: ${{ steps.hashes.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

      - name: Verify tag matches package.json version
        run: |
          pkg_version="v$(node -p "require('./package.json').version")"
          if [ "$pkg_version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $pkg_version"
            exit 1
          fi

      - name: Check if this version is already on npm
        id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Packed once, so the tarball on npm, the one attached to the GitHub
      # Release and the one the provenance covers are the same file.
      - name: Pack the npm tarball
        id: pack
        run: echo "tarball=$(npm pack --silent)" >> "$GITHUB_OUTPUT"

      - if: steps.check.outputs.published == 'false'
        run: npm publish "./${{ steps.pack.outputs.tarball }}" --provenance --access public

      # Checked separately from npm, so re-running the workflow after a failed
      # Registry publish retries it instead of skipping it with the npm step.
      - name: Check if this version is already in the MCP Registry
        id: registry
        run: |
          name="$(node -p "require('./server.json').name")"
          version="$(node -p "require('./server.json').version")"
          found="$(curl -fsSL --get "https://registry.modelcontextprotocol.io/v0/servers" \
            --data-urlencode "search=$name" \
            | jq -r --arg n "$name" --arg v "$version" \
              '[.servers[]? | (.server // .) | select(.name == $n and .version == $v)] | length' \
            || echo 0)"
          if [ "${found:-0}" -gt 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to the MCP Registry
        if: steps.registry.outputs.published == 'false'
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" \
            | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # The Registry checks npm for the version, which can take a minute to
          # show up right after publish, so retry before giving up.
          for attempt in 1 2 3 4 5 6; do
            ./mcp-publisher publish && exit 0
            echo "Publish attempt ${attempt} failed, retrying in 20s..."
            sleep 20
          done
          exit 1

      - name: Build the Claude Desktop bundle
        run: npm run mcpb:build

      - name: Hash the release files for provenance
        id: hashes
        run: |
          echo "hashes=$(sha256sum "${{ steps.pack.outputs.tarball }}" domeneshop-mcp-*.mcpb | base64 -w0)" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          generate_release_notes: true
          files: |
            ${{ steps.pack.outputs.tarball }}
            domeneshop-mcp-*.mcpb

      # Short-lived token from a GitHub App installed only on the tap. Commits
      # the App creates through the API are signed by GitHub, which the tap's
      # required-signatures rule needs (a personal token's are not).
      - name: Get a token for the Homebrew tap
        id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      # Opens a PR in martinzachariassen/homebrew-tap pointing the formula at
      # the tarball just published to npm, with auto-merge enabled. Skips if
      # the tap is already on this version, so re-runs are safe.
      - name: Bump the Homebrew formula
        run: ./scripts/bump-homebrew-formula.sh
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}

  # SLSA level 3 provenance for the npm tarball and the Claude Desktop bundle,
  # uploaded to the GitHub Release as multiple.intoto.jsonl. Verify with
  # slsa-verifier (see SECURITY.md). The generator has to be referenced by tag,
  # not SHA: it verifies its own ref when it runs.
  provenance:
    needs: release
    permissions:
      actions: read # read the workflow run for the provenance
      id-token: write # sign the provenance with Sigstore
      contents: write # upload it to the GitHub Release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.release.outputs.hashes }}
      upload-assets: true
