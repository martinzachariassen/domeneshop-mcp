version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # Every codeql-action step in a workflow must run the same version.
      codeql-action:
        patterns:
          - "github/codeql-action*"
